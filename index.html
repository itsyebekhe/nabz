<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نبض بازار | قیمت لحظه‌ای و نمودار تحلیلی ارز، طلا و سکه</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] },
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0b0f19; color: #f1f5f9; }
        .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card-hover:hover { border-color: rgba(59, 130, 246, 0.5); transform: translateY(-2px); transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800 glass-card sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold text-xl">
                    📊
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-black tracking-tight text-white flex items-center gap-2">
                        نبض بازار
                        <span class="text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                            زنده
                        </span>
                    </h1>
                    <p class="text-[11px] text-slate-400 hidden sm:block">آرشیو جامع و تحلیل ۳۷ ارز فیات، طلا و مسکوکات</p>
                </div>
            </div>

            <div class="text-left text-xs">
                <div class="text-slate-400 text-[10px]">آخرین بروزرسانی:</div>
                <div id="lastUpdated" class="text-slate-200 font-semibold tracking-wide text-xs">در حال دریافت...</div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Active Chart Spotlight -->
        <section id="spotlightSection" class="glass-card rounded-2xl p-5 sm:p-7 shadow-2xl relative overflow-hidden">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-5 border-b border-slate-800/80 pb-5">
                <div class="flex items-center gap-3">
                    <span id="activeIcon" class="text-3xl sm:text-4xl">🇺🇸</span>
                    <div>
                        <h2 id="activeTitle" class="text-xl sm:text-2xl font-black text-white">دلار آمریکا</h2>
                        <span id="activeSymbol" class="text-xs font-mono text-blue-400 tracking-wider">USD / TOMAN</span>
                    </div>
                </div>

                <div class="flex flex-wrap items-baseline gap-4">
                    <div>
                        <span class="text-[11px] text-slate-400 block">قیمت زنده بازار:</span>
                        <div class="flex items-baseline gap-1.5">
                            <span id="activePrice" class="text-3xl sm:text-4xl font-black text-white font-mono">---</span>
                            <span id="activeUnit" class="text-sm font-medium text-slate-400">تومان</span>
                        </div>
                    </div>

                    <button onclick="copyShareLink()" class="flex items-center gap-1.5 px-3 py-2 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        کپی لینک مستقیم
                    </button>
                </div>
            </div>

            <!-- Timeframe Selector -->
            <div class="flex flex-wrap items-center justify-between gap-3 mt-5">
                <div class="text-xs font-bold text-slate-300 flex items-center gap-2">
                    <span>نمودار تعاملی قیمت</span>
                    <span id="recordCountBadge" class="text-[11px] font-normal text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full"></span>
                </div>

                <div class="inline-flex p-1 rounded-xl bg-slate-900 border border-slate-800 text-xs font-medium">
                    <button onclick="changeTimeframe(7)" data-days="7" class="tf-btn px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition">۷ روز</button>
                    <button onclick="changeTimeframe(30)" data-days="30" class="tf-btn px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition">۱ ماه</button>
                    <button onclick="changeTimeframe(180)" data-days="180" class="tf-btn px-2.5 py-1 rounded-lg bg-blue-600 text-white shadow transition">۶ ماه</button>
                    <button onclick="changeTimeframe(365)" data-days="365" class="tf-btn px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition">۱ سال</button>
                    <button onclick="changeTimeframe('all')" data-days="all" class="tf-btn px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition">همه</button>
                </div>
            </div>

            <!-- Chart Canvas -->
            <div class="mt-3 relative h-[300px] sm:h-[360px] w-full">
                <canvas id="mainChart"></canvas>
                <div id="chartLoader" class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm rounded-xl flex items-center justify-center text-xs text-slate-300 font-medium">
                    در حال بارگذاری داده‌های تاریخی...
                </div>
            </div>
        </section>

        <!-- Category Filter & Search -->
        <section class="space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <!-- Categories -->
                <div class="flex flex-wrap gap-1.5 text-xs font-semibold">
                    <button onclick="setCategory('all')" id="cat-all" class="cat-btn px-3.5 py-2 rounded-xl bg-blue-600 text-white shadow">همه شاخص‌ها</button>
                    <button onclick="setCategory('major')" id="cat-major" class="cat-btn px-3.5 py-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white">ارزهای شاخص</button>
                    <button onclick="setCategory('gold')" id="cat-gold" class="cat-btn px-3.5 py-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white">طلا و سکه</button>
                    <button onclick="setCategory('fiat')" id="cat-fiat" class="cat-btn px-3.5 py-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white">سایر ارزها (فیات)</button>
                </div>

                <!-- Search -->
                <div class="relative min-w-[240px]">
                    <input type="text" id="searchInput" oninput="filterCards()" placeholder="جستجوی نام یا نماد..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                    <span class="absolute left-3 top-2.5 text-slate-500 text-xs">🔍</span>
                </div>
            </div>

            <!-- Market Grid -->
            <div id="marketGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3"></div>
        </section>

    </main>

    <!-- Toast for copying link -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-blue-600 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-xl transition-all duration-300 opacity-0 pointer-events-none transform translate-y-2">
        لینک مستقیم کپی شد! 📋
    </div>

    <script>
        const ALL_ASSETS = {
            "usd": { title: "دلار آمریکا", symbol: "USD", icon: "🇺🇸", category: "major", color: "#3b82f6" },
            "eur": { title: "یورو اروپا", symbol: "EUR", icon: "🇪🇺", category: "major", color: "#10b981" },
            "aed": { title: "درهم امارات", symbol: "AED", icon: "🇦🇪", category: "major", color: "#6366f1" },
            "try": { title: "لیر ترکیه", symbol: "TRY", icon: "🇹🇷", category: "major", color: "#ef4444" },
            "gbp": { title: "پوند انگلیس", symbol: "GBP", icon: "🇬🇧", category: "major", color: "#8b5cf6" },
            "cad": { title: "دلار کانادا", symbol: "CAD", icon: "🇨🇦", category: "major", color: "#ec4899" },
            "aud": { title: "دلار استرالیا", symbol: "AUD", icon: "🇦🇺", category: "major", color: "#06b6d4" },
            "cny": { title: "یوان چین", symbol: "CNY", icon: "🇨🇳", category: "major", color: "#f97316" },

            "gold_18k": { title: "طلای ۱۸ عیار", symbol: "GOLD_18K", icon: "✨", category: "gold", color: "#facc15" },
            "gold_mesghal": { title: "مثقال طلا", symbol: "MESGHAL", icon: "⚖️", category: "gold", color: "#fbbf24" },
            "coin_emami": { title: "سکه امامی", symbol: "COIN_EMAMI", icon: "🟡", category: "gold", color: "#f59e0b" },
            "coin_bahar": { title: "سکه بهار آزادی", symbol: "COIN_BAHAR", icon: "🟡", category: "gold", color: "#d97706" },
            "coin_half": { title: "نیم سکه", symbol: "COIN_HALF", icon: "🟡", category: "gold", color: "#eab308" },
            "coin_quarter": { title: "ربع سکه", symbol: "COIN_QUARTER", icon: "🟡", category: "gold", color: "#ca8a04" },
            "coin_gram": { title: "سکه گرمی", symbol: "COIN_GRAM", icon: "🟡", category: "gold", color: "#a16207" },
            "gold_ounce": { title: "انس جهانی طلا", symbol: "XAU", icon: "🌐", category: "gold", color: "#34d399", unit: "دلار" },

            "rub": { title: "روبل روسیه", symbol: "RUB", icon: "🇷🇺", category: "fiat", color: "#64748b" },
            "iqd": { title: "۱۰۰ دینار عراق", symbol: "IQD", icon: "🇮🇶", category: "fiat", color: "#64748b" },
            "myr": { title: "رینگیت مالزی", symbol: "MYR", icon: "🇲🇾", category: "fiat", color: "#64748b" },
            "gel": { title: "لاری گرجستان", symbol: "GEL", icon: "🇬🇪", category: "fiat", color: "#64748b" },
            "azn": { title: "منات آذربایجان", symbol: "AZN", icon: "🇦🇿", category: "fiat", color: "#64748b" },
            "amd": { title: "۱۰۰ درام ارمنستان", symbol: "AMD", icon: "🇦🇲", category: "fiat", color: "#64748b" },
            "thb": { title: "بات تایلند", symbol: "THB", icon: "🇹🇭", category: "fiat", color: "#64748b" },
            "omr": { title: "ریال عمان", symbol: "OMR", icon: "🇴🇲", category: "fiat", color: "#64748b" },
            "inr": { title: "روپیه هند", symbol: "INR", icon: "🇮🇳", category: "fiat", color: "#64748b" },
            "pkr": { title: "روپیه پاکستان", symbol: "PKR", icon: "🇵🇰", category: "fiat", color: "#64748b" },
            "jpy": { title: "۱۰۰ ین ژاپن", symbol: "JPY", icon: "🇯🇵", category: "fiat", color: "#64748b" },
            "sar": { title: "ریال عربستان", symbol: "SAR", icon: "🇸🇦", category: "fiat", color: "#64748b" },
            "afn": { title: "افغانی افغانستان", symbol: "AFN", icon: "🇦🇫", category: "fiat", color: "#64748b" },
            "sek": { title: "کرون سوئد", symbol: "SEK", icon: "🇸🇪", category: "fiat", color: "#64748b" },
            "chf": { title: "فرانک سوئیس", symbol: "CHF", icon: "🇨🇭", category: "fiat", color: "#64748b" },
            "qar": { title: "ریال قطر", symbol: "QAR", icon: "🇶🇦", category: "fiat", color: "#64748b" },
            "krw": { title: "۱۰۰ وون کره", symbol: "KRW", icon: "🇰🇷", category: "fiat", color: "#64748b" },
            "nok": { title: "کرون نروژ", symbol: "NOK", icon: "🇳🇴", category: "fiat", color: "#64748b" },
            "nzd": { title: "دلار نیوزیلند", symbol: "NZD", icon: "🇳🇿", category: "fiat", color: "#64748b" },
            "sgd": { title: "دلار سنگاپور", symbol: "SGD", icon: "🇸🇬", category: "fiat", color: "#64748b" },
            "hkd": { title: "دلار هنگ کنگ", symbol: "HKD", icon: "🇭🇰", category: "fiat", color: "#64748b" },
            "kwd": { title: "دینار کویت", symbol: "KWD", icon: "🇰🇼", category: "fiat", color: "#64748b" },
            "dkk": { title: "کرون دانمارک", symbol: "DKK", icon: "🇩🇰", category: "fiat", color: "#64748b" },
            "bhd": { title: "دینار بحرین", symbol: "BHD", icon: "🇧🇭", category: "fiat", color: "#64748b" },
            "tjs": { title: "سامانی تاجیکستان", symbol: "TJS", icon: "🇹🇯", category: "fiat", color: "#64748b" },
            "tmt": { title: "منات ترکمنستان", symbol: "TMT", icon: "🇹🇲", category: "fiat", color: "#64748b" },
            "kgs": {"title": "سام قرقیزستان", symbol: "KGS", icon: "🇰🇬", category: "fiat", color: "#64748b" },
            "syp": { title: "۱۰۰ لیر سوریه", symbol: "SYP", icon: "🇸🇾", category: "fiat", color: "#64748b" },
            "brl": { title: "رئال برزیل", symbol: "BRL", icon: "🇧🇷", category: "fiat", color: "#64748b" },
            "ars": { title: "پزو آرژانتین", symbol: "ARS", icon: "🇦🇷", category: "fiat", color: "#64748b" },
        };

        let marketData = {};
        let activeAssetKey = "usd";
        let activeHistory = [];
        let currentTimeframe = 180;
        let currentCategory = "all";
        let chartInstance = null;

        const toPersianDigits = (n) => String(n).replace(/[0-9]/g, d => ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'][+d]);
        const formatNumber = (num) => (num === null || num === undefined || isNaN(num)) ? "---" : toPersianDigits(Number(num).toLocaleString('en-US'));

        async function initApp() {
            const hash = window.location.hash.replace('#', '').trim();
            if (hash && ALL_ASSETS[hash]) activeAssetKey = hash;

            window.addEventListener('hashchange', () => {
                const newHash = window.location.hash.replace('#', '').trim();
                if (newHash && ALL_ASSETS[newHash] && newHash !== activeAssetKey) selectAsset(newHash, false);
            });

            await fetchMarketSummary();
            renderMarketGrid();
            await loadActiveAssetHistory();
        }

        async function fetchMarketSummary() {
            try {
                const res = await fetch('./market.json?t=' + Date.now());
                if (!res.ok) throw new Error("fetch error");
                marketData = await res.json();
                document.getElementById('lastUpdated').textContent = `${marketData.date_shamsi || ''} - ${toPersianDigits(marketData.time || '--:--')}`;
            } catch (err) {
                document.getElementById('lastUpdated').textContent = "درحال بارگذاری داده‌ها...";
            }
        }

        function renderMarketGrid() {
            const grid = document.getElementById('marketGrid');
            grid.innerHTML = '';
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

            for (const [key, cfg] of Object.entries(ALL_ASSETS)) {
                if (currentCategory !== 'all' && cfg.category !== currentCategory) continue;
                if (searchVal && !cfg.title.toLowerCase().includes(searchVal) && !cfg.symbol.toLowerCase().includes(searchVal)) continue;

                const price = marketData[key];
                const unit = cfg.unit || "تومان";
                const isSelected = (key === activeAssetKey);

                const card = document.createElement('div');
                card.id = `card-${key}`;
                card.className = `glass-card glass-card-hover rounded-xl p-3 cursor-pointer relative overflow-hidden transition ${isSelected ? 'ring-2 ring-blue-500 bg-blue-900/10' : ''}`;
                card.onclick = () => selectAsset(key, true);

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xl">${cfg.icon}</span>
                        <span class="text-[10px] font-mono text-slate-400 bg-slate-800/80 px-1.5 py-0.5 rounded">${cfg.symbol}</span>
                    </div>
                    <div class="text-xs font-semibold text-slate-300 truncate mb-1">${cfg.title}</div>
                    <div class="flex items-baseline gap-1">
                        <span class="text-sm sm:text-base font-black text-white font-mono">${formatNumber(price)}</span>
                        <span class="text-[10px] text-slate-400">${unit}</span>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-3.5 py-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white transition";
            });
            document.getElementById(`cat-${cat}`).className = "cat-btn px-3.5 py-2 rounded-xl bg-blue-600 text-white shadow transition";
            renderMarketGrid();
        }

        function filterCards() {
            renderMarketGrid();
        }

        async function selectAsset(key, updateHash = true) {
            if (!ALL_ASSETS[key]) return;
            activeAssetKey = key;
            if (updateHash) window.location.hash = key;

            document.querySelectorAll('#marketGrid > div').forEach(el => el.classList.remove('ring-2', 'ring-blue-500', 'bg-blue-900/10'));
            const activeCard = document.getElementById(`card-${key}`);
            if (activeCard) activeCard.classList.add('ring-2', 'ring-blue-500', 'bg-blue-900/10');

            if (window.innerWidth < 1024) document.getElementById('spotlightSection').scrollIntoView({ behavior: 'smooth' });
            await loadActiveAssetHistory();
        }

        async function loadActiveAssetHistory() {
            const cfg = ALL_ASSETS[activeAssetKey];
            const unit = cfg.unit || "تومان";
            document.getElementById('activeTitle').textContent = cfg.title;
            document.getElementById('activeIcon').textContent = cfg.icon;
            document.getElementById('activeSymbol').textContent = `${cfg.symbol} / ${unit.toUpperCase()}`;
            document.getElementById('activeUnit').textContent = unit;
            document.getElementById('activePrice').textContent = formatNumber(marketData[activeAssetKey]);

            const loader = document.getElementById('chartLoader');
            loader.classList.remove('hidden');

            try {
                const res = await fetch(`./api/history_${activeAssetKey}.json?t=` + Date.now());
                if (!res.ok) throw new Error("History fetch error");
                const json = await res.json();
                activeHistory = json.history || [];
                document.getElementById('recordCountBadge').textContent = `${toPersianDigits(activeHistory.length)} روز سابقه`;
                renderChart();
            } catch (err) {
                activeHistory = [];
                if (chartInstance) chartInstance.destroy();
            } finally {
                loader.classList.add('hidden');
            }
        }

        function renderChart() {
            if (!activeHistory.length) return;
            const cfg = ALL_ASSETS[activeAssetKey];
            const unit = cfg.unit || "تومان";
            const ctx = document.getElementById('mainChart').getContext('2d');

            let filtered = (currentTimeframe !== 'all') ? activeHistory.slice(-currentTimeframe) : [...activeHistory];
            const labels = filtered.map(item => item.date);
            const dataPoints = filtered.map(item => item.price);

            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, `${cfg.color || '#3b82f6'}40`);
            gradient.addColorStop(1, `${cfg.color || '#3b82f6'}00`);

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: cfg.title,
                        data: dataPoints,
                        borderColor: cfg.color || '#3b82f6',
                        borderWidth: 2,
                        pointRadius: filtered.length > 50 ? 0 : 3,
                        pointHoverRadius: 5,
                        backgroundColor: gradient,
                        fill: true,
                        tension: 0.25
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            rtl: true,
                            backgroundColor: '#0f172a',
                            titleFont: { family: 'Vazirmatn' },
                            bodyFont: { family: 'Vazirmatn', weight: 'bold' },
                            padding: 10,
                            displayColors: false,
                            callbacks: { label: (ctx) => `${cfg.title}: ${formatNumber(ctx.parsed.y)} ${unit}` }
                        }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#64748b', font: { family: 'Vazirmatn', size: 10 }, maxTicksLimit: 7 } },
                        y: { position: 'right', grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', font: { family: 'Vazirmatn', size: 10 }, callback: (val) => toPersianDigits(Number(val).toLocaleString()) } }
                    }
                }
            });
        }

        function changeTimeframe(days) {
            currentTimeframe = days;
            document.querySelectorAll('.tf-btn').forEach(btn => {
                btn.className = (btn.getAttribute('data-days') === String(days)) ? "tf-btn px-2.5 py-1 rounded-lg bg-blue-600 text-white shadow transition" : "tf-btn px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition";
            });
            renderChart();
        }

        function copyShareLink() {
            navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}#${activeAssetKey}`).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
                setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2'), 2500);
            });
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
