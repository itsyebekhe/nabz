name: Fetch Market Rates & Update API

on:
  schedule:
    - cron: '*/37 * * * *'
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

env:
  TZ: Asia/Tehran

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml cloudscraper matplotlib tzdata

      - name: Run fetch script and generate outputs
        run: python fetch_rates.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market.json README.md api/*.json *.png share/*.html charts/*.png
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(auto): update rates, API history and charts [skip ci]"
            git push
          fi
