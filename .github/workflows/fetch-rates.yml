name: Fetch Market Rates & Update API

on:
  schedule:
    - cron: '7,37 * * * *'   # Runs every 30 minutes (offset by 7 mins to avoid queue congestion)
  workflow_dispatch:         # Allows manual trigger from GitHub UI

permissions:
  contents: write

env:
  TZ: Asia/Tehran

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"       # Speeds up runs by caching installed libraries

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml cloudscraper matplotlib tzdata

      - name: Run fetch script and generate outputs
        run: python fetch_rates.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all data JSONs, charts, and README
          git add market.json README.md api/*.json *.png
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(auto): update rates, API history and charts [skip ci]"
            git push
          fi
